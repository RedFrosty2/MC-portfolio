[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "odysseus"
version = "0.1.0"
description = "Personal training planning and analytics."
requires-python = ">=3.12,<3.13"
dependencies = []


[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "ruff>=0.14",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
]


[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"

files = ["src"]

check_untyped_defs = true
disallow_untyped_defs = true

warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

show_error_codes = true
pretty = true

[tool.setuptools.packages.find]
where = ["src"]