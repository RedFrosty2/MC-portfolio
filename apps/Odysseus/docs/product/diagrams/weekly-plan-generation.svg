<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="384px" preserveAspectRatio="none" style="width:1680px;height:384px;background:#FFFFFF;" version="1.1" viewBox="0 0 1680 384" width="1680px" zoomAndPan="magnify"><defs/><g><text fill="#0F172A" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="249" x="708.5" y="23.1318">Odysseus - Weekly Plan Generation</text><rect fill="#F1F5F9" height="144.5386" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="159" x="7" y="234.0986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="132" x="20.5" y="251.2925">PLANNING CONTEXT</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="84.5" y="266.2412">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="137" x="18" y="281.1899">Goals and target events</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="111" x="31" y="296.1387">Effective availability</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="69" x="52" y="311.0874">Explicit rest</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="108" x="32.5" y="326.0361">Completed training</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="149" x="12" y="340.9849">Recovery and progression</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="117" x="28" y="355.9336">Learned preferences</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="99" x="37" y="370.8823">Evidence context</text><rect fill="#E8F4F4" height="114.6411" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="173" x="333" y="249.0986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="140" x="349.5" y="266.2925">LOCAL LLM PLANNER</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="417.5" y="281.2412">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="163" x="338" y="296.1899">Applies coaching judgement</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="158" x="340.5" y="311.1387">Builds the week as a whole</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="132" x="353.5" y="326.0874">Coordinates modalities</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="123" x="358" y="341.0361">Creates prescriptions</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="154" x="342.5" y="355.9849">Provides planning rationale</text><rect fill="#E0F2FE" height="129.5898" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="181" x="684" y="151.5986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="171" x="689" y="168.7925">CANDIDATE WEEKLY PLAN</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="772.5" y="183.7412">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="109" x="720" y="198.6899">Monday to Sunday</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="47" x="751" y="213.6387">Running</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="49" x="750" y="228.5874">Strength</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="93" x="728" y="243.5361">Hybrid / HYROX</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="27" x="761" y="258.4849">Rest</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="138" x="705.5" y="273.4336">Structured prescriptions</text><rect fill="#EEF2FF" height="114.6411" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="172" x="1011" y="155.0986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="148" x="1023" y="172.2925">ODYSSEUS VALIDATES</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="1095" y="187.2412">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="162" x="1016" y="202.1899">Structure and required fields</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="157" x="1018.5" y="217.1387">Availability and explicit rest</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="137" x="1028.5" y="232.0874">Supported prescriptions</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="147" x="1023.5" y="247.0361">Hard planning constraints</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="141" x="1026.5" y="261.9849">Complete planning week</text><g id="elem_Valid"><polygon fill="#F1F1F1" points="1256,195.5986,1268,207.5986,1256,219.5986,1244,207.5986,1256,195.5986" style="stroke:#181818;stroke-width:0.5;"/></g><rect fill="#FFF7ED" height="69.7949" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="218" x="1456" y="292.5986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="208" x="1461" y="309.7925">RETURN VALIDATION FEEDBACK</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="1563" y="324.7412">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="160" x="1485" y="339.6899">Explain failed constraints or</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="194" x="1468" y="354.6387">structural problems to the planner</text><rect fill="#DCFCE7" height="84.7437" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="171" x="1479.5" y="44.0986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="144" x="1493" y="61.2925">ACTIVE WEEKLY PLAN</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="1563" y="76.2412">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="131" x="1499.5" y="91.1899">Persist structured plan</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="147" x="1491.5" y="106.1387">Weekly aim and rationale</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="161" x="1484.5" y="121.0874">Ready for athlete inspection</text><rect fill="#FEE2E2" height="84.7437" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="147" x="1491.5" y="164.0986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="134" x="1498" y="181.2925">GENERATION FAILED</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="1563" y="196.2412">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="137" x="1496.5" y="211.1899">No invalid or partial plan</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="90" x="1520" y="226.1387">becomes active</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="92" x="1519" y="241.0874">Failure is visible</text><!--link Context to Planner--><g id="link_Context_Planner"><path d="M166.36,306.5986 C216.56,306.5986 275.56,306.5986 326.99,306.5986 " fill="none" id="Context-to-Planner" style="stroke:#64748B;stroke-width:2.0;"/><polygon fill="#64748B" points="332.99,306.5986,323.99,302.5986,327.99,306.5986,323.99,310.5986,332.99,306.5986" style="stroke:#64748B;stroke-width:2.0;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="105" x="197" y="303.7925">structured context</text></g><!--link Planner to Candidate--><g id="link_Planner_Candidate"><path d="M506.4,284.6986 C560.18,270.9886 623.5361,254.8312 678.0061,240.9412 " fill="none" id="Planner-to-Candidate" style="stroke:#64748B;stroke-width:2.0;"/><polygon fill="#64748B" points="683.82,239.4586,674.1107,237.8065,678.975,240.6941,676.0875,245.5585,683.82,239.4586" style="stroke:#64748B;stroke-width:2.0;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="116" x="537" y="244.7925">coaching judgement</text></g><!--link Candidate to Validate--><g id="link_Candidate_Validate"><path d="M865.2,215.4786 C910.76,214.9086 959.8205,214.2934 1004.7305,213.7334 " fill="none" id="Candidate-to-Validate" style="stroke:#64748B;stroke-width:2.0;"/><polygon fill="#64748B" points="1010.73,213.6586,1001.6808,209.7712,1005.7304,213.721,1001.7806,217.7705,1010.73,213.6586" style="stroke:#64748B;stroke-width:2.0;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="84" x="896" y="210.7925">candidate plan</text></g><!--link Validate to Valid--><g id="link_Validate_Valid"><path d="M1183.39,209.8786 C1207.56,209.1086 1224.8431,208.56 1238.0031,208.14 " fill="none" id="Validate-to-Valid" style="stroke:#64748B;stroke-width:2.0;"/><polygon fill="#64748B" points="1244,207.9486,1234.8