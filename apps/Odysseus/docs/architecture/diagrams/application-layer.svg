<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="589px" preserveAspectRatio="none" style="width:1137px;height:589px;background:#FFFFFF;" version="1.1" viewBox="0 0 1137 589" width="1137px" zoomAndPan="magnify"><defs/><g><text fill="#0F172A" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="202" x="459" y="23.1318">Odysseus - Application Layer</text><!--cluster application/--><g id="cluster_application/"><path d="M308.5,114.5986 L371.5,114.5986 A13.5,13.5 0 0 1 380.5,123.5986 L387.5,135.5474 L1087.5,135.5474 A9,9 0 0 1 1096.5,144.5474 L1096.5,280.5986 A9,9 0 0 1 1087.5,289.5986 L308.5,289.5986 A9,9 0 0 1 299.5,280.5986 L299.5,123.5986 A9,9 0 0 1 308.5,114.5986 " fill="#F0FDFA" style="stroke:#94A3B8;stroke-width:1.5;"/><line style="stroke:#94A3B8;stroke-width:1.5;" x1="299.5" x2="387.5" y1="135.5474" y2="135.5474"/><text fill="#334155" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="75" x="303.5" y="128.7925">application/</text></g><!--entity UseCases--><g id="elem_UseCases"><rect fill="#D1FAE5" height="124.6411" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="249" x="315.5" y="148.0986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="89" x="325.5" y="170.2925">availability.py</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="325.5" y="185.2412">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="166" x="325.5" y="200.1899">TrainingAvailabilityUseCases</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="325.5" y="215.1387">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" text-decoration="underline" textLength="17" x="325.5" y="230.0874">init</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="37" x="342.5" y="230.0874">(store)</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="149" x="325.5" y="245.0361">get_recurring_availability()</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="229" x="325.5" y="259.9849">update_recurring_availability(availability)</text></g><!--entity Contract--><g id="elem_Contract"><rect fill="#CCFBF1" height="124.6411" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="221" x="859.5" y="148.0986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="76" x="869.5" y="170.2925">contracts.py</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="869.5" y="185.2412">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="137" x="869.5" y="200.1899">TrainingAvailabilityStore</text><text fill="#0F172A" font-family="Arial" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="48" x="869.5" y="215.1387">Protocol</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="869.5" y="230.0874">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="201" x="869.5" y="245.0361">load(): RecurringTrainingAvailability</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="131" x="869.5" y="259.9849">save(availability): None</text></g><!--entity Web--><g id="elem_Web"><rect fill="#E0F2FE" height="79.7949" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="179" x="7" y="170.5986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="78" x="17" y="192.7925">WEB ROUTE</text><text fill="#0F172A" font-family="Arial" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="84" x="17" y="207.7412">driving adapter</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="17" y="222.6899">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="159" x="17" y="237.6387">Calls application operations</text></g><!--entity Domain--><g id="elem_Domain"><rect fill="#EDE9FE" height="49.8975" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="206" x="867" y="533.5986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="186" x="877" y="555.7925">RecurringTrainingAvailability</text><text fill="#0F172A" font-family="Arial" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="76" x="877" y="570.7412">domain value</text></g><!--entity Adapter--><g id="elem_Adapter"><rect fill="#FFEDD5" height="64.8462" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="237" x="851.5" y="343.0986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="173" x="861.5" y="365.2925">CONCRETE STORE OBJECT</text><text fill="#0F172A" font-family="Arial" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="131" x="861.5" y="380.2412">current runtime object:</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="217" x="861.5" y="395.1899">InMemoryTrainingAvailabilityStore&lt;/i&gt;</text></g><g id="elem_GMN13"><path d="M291,52.0986 L291,88.9448 A9,9 0 0 0 300,97.9448 L436,97.9448 L440,147.9786 L444,97.9448 L580,97.9448 A9,9 0 0 0 589,88.9448 L589,53.0986 L579,43.0986 L300,43.0986 A9,9 0 0 0 291,52.0986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M579,43.0986 L579,48.5986 A4.5,4.5 0 0 0 583.5,53.0986 L589,53.0986 L579,43.0986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="277" x="297" y="60.2925">The use case coordinates application behaviour.</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="193" x="297" y="75.2412">Currently GET delegates to load()</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="181" x="297" y="90.1899">and update delegates to save().</text></g><g id="elem_GMN16"><path d="M845.5,52.0986 L845.5,88.9448 A9,9 0 0 0 854.5,97.9448 L966,97.9448 L970,147.9786 L974,97.9448 L1085.5,97.9448 A9,9 0 0 0 1094.5,88.9448 L1094.5,53.0986 L1084.5,43.0986 L854.5,43.0986 A9,9 0 0 0 845.5,52.0986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M1084.5,43.0986 L1084.5,48.5986 A4.5,4.5 0 0 0 1089,53.0986 L1094.5,53.0986 L1084.5,43.0986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="211" x="851.5" y="60.2925">The Protocol is a type-level contract.</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="228" x="851.5" y="75.2412">It is not another runtime object between</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="227" x="851.5" y="90.1899">the use case and the concrete adapter.</text></g><g id="elem_GMN19"><path d="M813,452.0986 L813,488.9448 A9,9 0 0 0 822,497.9448 L1118,497.9448 A9,9 0 0 0 1127,488.9448 L1127,453.0986 L1117,443.0986 L974,443.0986 L970,408.1286 L966,443.0986 L822,443.0986 A9,9 0 0 0 813,452.0986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M1117,443.0986 L1117,448.5986 A4.5,4.5 0 0 0 1121.5,453.0986 L1127,453.0986 L1117,443.0986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="293" x="819" y="460.2925">At runtime the use case holds the concrete object,</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="234" x="819" y="475.2412">while application source is typed against</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="141" x="819" y="490.1899">TrainingAvailabilityStore.</text></g><!--link Web to UseCases--><g id="link_Web_UseCases"><path d="M186.33,210.5986 C225.66,210.5986 266.59,210.5986 309.26,210.5986 " fill="none" id="Web-to-UseCases" style="stroke:#64748B;stroke-width:2.0;"/><polygon fill="#64748B" points="315.26,210.5986,306.26,206.5986,310.26,210.5986,306.26,214.5986,315.26,210.5986" style="stroke:#64748B;stroke-width:2.0;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="43" x="217" y="207.7925">invokes</text></g><!--link UseCases to Contract--><g id="link_UseCases_Contract"><path d="M564.79,210.5986 C654.1,210.5986 767.57,210.5986 853.43,210.5986 " fill="none" id="UseCases-to-Contract" style="stroke:#64748B;stroke-width:2.0;"/><polygon fill="#64748B" points="859.43,210.5986,850.43,206.5986,854.43,210.5986,850.43,214.5986,859.43,210.5986" style="stroke:#64748B;stroke-width:2.0;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="113" x="644.5" y="207.7925">source dependency</text></g><!--link UseCases to Domain--><g id="link_UseCases_Domain"><path d="M500.65,273.2286 C569.66,342.1986 689.71,451.7486 813,515.5986 C829.71,524.2586 842.6296,529.5501 861.0596,535.2701 " fill="none" id="UseCases-to-Domain" style="stroke:#64748B;stroke-width:2.0;"/><polygon fill="#64748B" points="866.79,537.0486,859.3801,530.5607,862.0147,535.5666,857.0088,538.2011,866.79,537.0486" style="stroke:#64748B;stroke-width:2.0;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="98" x="652" y="378.7