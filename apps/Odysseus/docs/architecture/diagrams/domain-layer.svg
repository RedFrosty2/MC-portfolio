<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="709px" preserveAspectRatio="none" style="width:847px;height:709px;background:#FFFFFF;" version="1.1" viewBox="0 0 847 709" width="847px" zoomAndPan="magnify"><defs/><g><text fill="#0F172A" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="176" x="327.25" y="23.1318">Odysseus - Domain Layer</text><!--cluster domain/availability.py--><g id="cluster_domain/availability.py"><path d="M15,43.0986 L144,43.0986 A13.5,13.5 0 0 1 153,52.0986 L160,64.0474 L277,64.0474 A9,9 0 0 1 286,73.0474 L286,690.5986 A9,9 0 0 1 277,699.5986 L15,699.5986 A9,9 0 0 1 6,690.5986 L6,52.0986 A9,9 0 0 1 15,43.0986 " fill="#FAF5FF" style="stroke:#94A3B8;stroke-width:1.5;"/><line style="stroke:#94A3B8;stroke-width:1.5;" x1="6" x2="160" y1="64.0474" y2="64.0474"/><text fill="#334155" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="141" x="10" y="57.2925">domain/availability.py</text></g><!--entity Weekday--><g id="elem_Weekday"><rect fill="#F3E8FF" height="169.4873" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="85" x="101.5" y="514.5986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="59" x="111.5" y="536.7925">Weekday</text><text fill="#0F172A" font-family="Arial" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="51" x="111.5" y="551.7412">StrEnum</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="111.5" y="566.6899">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="46" x="111.5" y="581.6387">monday</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="46" x="111.5" y="596.5874">tuesday</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="65" x="111.5" y="611.5361">wednesday</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="50" x="111.5" y="626.4849">thursday</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="31" x="111.5" y="641.4336">friday</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="50" x="111.5" y="656.3823">saturday</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="42" x="111.5" y="671.3311">sunday</text></g><!--entity Daily--><g id="elem_Daily"><rect fill="#EDE9FE" height="124.6411" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="176" x="56" y="281.5986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="156" x="66" y="303.7925">DailyTrainingAvailability</text><text fill="#0F172A" font-family="Arial" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="96" x="66" y="318.7412">frozen dataclass</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="66" y="333.6899">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="114" x="66" y="348.6387">weekday: Weekday</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="106" x="66" y="363.5874">am_available: bool</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="106" x="66" y="378.5361">pm_available: bool</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="99" x="66" y="393.4849">is_rest_day: bool</text></g><!--entity Recurring--><g id="elem_Recurring"><rect fill="#E9D5FF" height="79.7949" rx="9" ry="9" style="stroke:#CBD5E1;stroke-width:0.5;" width="247" x="22.5" y="76.0986"/><text fill="#0F172A" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="186" x="32.5" y="98.2925">RecurringTrainingAvailability</text><text fill="#0F172A" font-family="Arial" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="96" x="32.5" y="113.2412">frozen dataclass</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="32.5" y="128.1899">&#160;</text><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="227" x="32.5" y="143.1387">days: tuple[DailyTrainingAvailability, ...]</text></g><g id="elem_GMN8"><path d="M630.5,258.5986 L630.5,429.9834 A9,9 0 0 0 639.5,438.9834 L828.5,438.9834 A9,9 0 0 0 837.5,429.9834 L837.5,259.5986 L827.5,249.5986 L639.5,249.5986 A9,9 0 0 0 630.5,258.5986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M827.5,249.5986 L827.5,255.0986 A4.5,4.5 0 0 0 832,259.5986 L837.5,259.5986 L827.5,249.5986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:1.0;"/><text fill="#334155" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="56" x="636.5" y="266.7925">Invariant</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="636.5" y="281.7412">&#160;</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="150" x="636.5" y="296.6899">REST cannot coexist with</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="126" x="636.5" y="311.6387">AM or PM availability.</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="636.5" y="326.5874">&#160;</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="160" x="636.5" y="341.5361">Valid ordinary unavailability:</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="60" x="636.5" y="356.4849">AM=False</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="60" x="636.5" y="371.4336">PM=False</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="74" x="636.5" y="386.3823">REST=False</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="636.5" y="401.3311">&#160;</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="173" x="636.5" y="416.2798">Unavailable and explicit REST</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="186" x="636.5" y="431.2285">therefore remain different states.</text></g><g id="elem_GMN11"><path d="M305,67.5986 L305,112.0986 L269.62,116.0986 L305,120.0986 L305,164.2397 A9,9 0 0 0 314,173.2397 L526,173.2397 A9,9 0 0 0 535,164.2397 L535,68.5986 L525,58.5986 L314,58.5986 A9,9 0 0 0 305,67.5986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M525,58.5986 L525,64.0986 A4.5,4.5 0 0 0 529.5,68.5986 L535,68.5986 L525,58.5986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:0.5;"/><text fill="#334155" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="56" x="311" y="75.7925">Invariant</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="311" y="90.7412">&#160;</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="150" x="311" y="105.6899">A recurring week contains</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209" x="311" y="120.6387">exactly one entry for each weekday.</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="311" y="135.5874">&#160;</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="178" x="311" y="150.5361">Missing or duplicate weekdays</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="72" x="311" y="165.4849">are rejected.</text></g><g id="elem_GMN14"><path d="M302.5,318.0986 L302.5,369.8936 A9,9 0 0 0 311.5,378.8936 L586.5,378.8936 A9,9 0 0 0 595.5,369.8936 L595.5,319.0986 L585.5,309.0986 L311.5,309.0986 A9,9 0 0 0 302.5,318.0986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M585.5,309.0986 L585.5,314.5986 A4.5,4.5 0 0 0 590,319.0986 L595.5,319.0986 L585.5,309.0986 " fill="#FFFDE7" style="stroke:#D6B656;stroke-width:1.0;"/><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="272" x="308.5" y="326.2925">The domain owns training meaning and validity.</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="4" x="308.5" y="341.2412">&#160;</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="220" x="308.5" y="356.1899">It does not know about FastAPI, Jinja,</text><text fill="#334155" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="209" x="308.5" y="371.1387">forms, HTTP, or storage technology.</text></g><!--link Recurring to Daily--><g id="link_Recurring_Daily"><path d="M145.65,156.2086 C145.35,190.6986 144.9526,235.5389 144.6026,275.4889 " fill="none" id="Recurring-to-Daily" style="stroke:#64748B;stroke-width:2.0;"/><polygon fill="#64748B" points="144.55,281.4886,148.6287,272.524,144.5938,276.4888,140.629,272.4539,144.55,281.4886" style="stroke:#64748B;stroke-width:2.0;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="197" x="147" y="216.7925">contains exactly one per weekday</text></g><!--link Daily to Weekday--><g id="link_Daily_Weekday"><path d="M144,406.6686 C144,438.9886 144,473.0786 144,508.1986 " fill="none" id="Daily-to-Weekday" style="stroke:#64748B;stroke-width:2.0;"/><polygon fill="#64748B" points="144,514.1986,148,505.1986,144,509.1986,140,505.1986,144,514.1986" style="stroke:#64748B;stroke-width:2.0;"/><text fill="#0F172A" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="76" x="145" y="481.7925">identifies day</text></g><!--link Daily to GMN8--><g id="link_Daily_GMN8"><path d="M199.27,281.2986 C227.18,254.3286 263.39,225.7886 302.5,211.5986 C424.91,167.1686 474.65,163.0986 595.5,211.5986 C616.96,220.2086 636.98,233.9186 654.76,249.3086 " fill="none" id="Daily-GMN8" style="stroke:#64748B;stroke-width:2.0;stroke-dasharray:7.0,7.0;"/></g><!--link Recurring to GMN14--><g id="link_Recurring_GMN14"><path d="M242.91,156.1986 C294.37,177.1986 348.07,199.5986 353,203.5986 C388.49,232.4086 416.29,277.6886 432.64,308.7986 " fill="none" id="Recurring-GMN14" style="stroke:#64748B;stroke-width:2.0;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[dLHDRzj64BtlhnWuLrck8iiVWcj0YaJKHTmQjTeUgi8OaKDn8tANs1rQOOByzyvIb4BRogMwS3KVRzwycLtMd1FydjJUK-NX56QsG6tW8zRab69R0bjOMMPRGA8TnQojKPbE2AWekOQ4VEnqsPYLtsXJeiC2LXXlrivM9lbWS-lWNTJyEX4-myHkjLb3YhcdZgT9Ywqpv61mrN5CdBFR5k_Y_FByQlhQkSXql37aFRplk19AiSevieP_mu8aL6D-tF-eln0CXiUTRUcVei7b-qadP15KV1lGRKc4GxCMhRygaD_KkeHS6_vXEXlD1utzBSYtBamfgkBwACZr-MGulNeDCXoU3qQZbo36yW7Xo9HcyyktwBEBwSNeuiVeQi_i96aMw0oVKUUuqhdckb_M9m8zYKPHr1R-hiV9pUhsRw9DWlNDsUfsQMxqxIExkQcAcpCj_vUci4QyIyCL-UQmfSIqHyugjpkbJZTVZrovtQaAUIU07jeAmc8ulv8rF49Y9eJhXHFoifEJ3lq3hTJPBsGWGSOuH-_t_BOxyF6-oj9WyTGAaDDOhe_DbwOyOjF-oP7dfoOxc1go3HDuDv_DhwFvCQf_K5mv9pJ_5rqfviV0LPdJFpzikWVzVl_VXiwXcb2wdiaCmy2_6qzFRrl6OuXbDmJB0tt6cCLa3K4frxYLIEq2Gyf-8cEGjyImJZLv226gsK-drnc3JNVGIfg-CyyezzPmQ508p1yN4AEHQ2bBdxLds6hErEGUP3SVxk752Yhr5-Ow4LUY3ReQAjFrZoNjvwXvXnxsXr2XFQe_pM5sW2QH_ifSnveX12dEo55gdT2cvlbCT9gAoJ1uHYRVLoH9eR7NxHrqFDBY98ozLJa8U91NTUMLAjAEL0V2EDihBGtVQ-z3gdYIAj0L9dktLzYm_IHxHSaRUks3_uBV8YFONMwmMnanjri31M7p3Rey1v5tUj-nXCjCmu0sncu1LxPYYD3pvE6k1xzgymbxIeWNlWU_B1OFlK3LitNX8M6ACoFFpBhkiFiF]--></g></svg>