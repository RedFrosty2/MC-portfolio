name: Odysseus CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest

    outputs:
      odysseus: ${{ steps.changes.outputs.odysseus }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Odysseus changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          if git diff --quiet "$BASE" "$HEAD" -- \
            apps/Odysseus/ \
            .github/workflows/odysseus-ci.yml; then
            echo "odysseus=false" >> "$GITHUB_OUTPUT"
          else
            echo "odysseus=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Quality and tests
    needs: changes
    if: needs.changes.outputs.odysseus == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/Odysseus

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/Odysseus/pyproject.toml

      - name: Install Odysseus development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest

  required:
    name: Required gate
    needs:
      - changes
      - checks

    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate Odysseus CI
        shell: bash
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection failed."
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.odysseus }}" == "false" ]]; then
            echo "No Odysseus changes detected."
            exit 0
          fi

          if [[ "${{ needs.checks.result }}" != "success" ]]; then
            echo "Odysseus quality checks failed."
            exit 1
          fi

          echo "Odysseus CI passed."